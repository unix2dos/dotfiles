# Skills Manager
# 阅读顺序：安装到哪里 → 原生扩展 → 预设内容 → 下载来源。

# 1. 每个目录安装什么 Skill
install:
  "~/.claude/skills":
    preset: default

  "~/.cursor/skills":
    preset: default

  "~/.agents/skills":
    preset: default

  "~/.gemini/antigravity/skills":
    preset: default

  "~/.gemini/antigravity-cli/skills":
    preset: default

  "~/.config/opencode/skills":
    preset: default

  "~/.workbuddy/skills":
    preset: default

# 2. 工具原生扩展（不安装到上面的 Skill 目录）
extensions:
  ponytail:
    hosts: [codex, cursor, claude, devin, opencode]

# 3. 可复用的 Skill 预设
presets:
  default:
    # 包含这些 Source 经过 include/exclude 后提供的全部 Skill
    sources:
      - unix2dos
      - ljg-skills
      - mattpocock-engineering
      - mattpocock-productivity
      - sepia

    # 单 Skill Source：Source 名就是最终 Skill 名
    skills:
      - archify
      - show-me
      - find-skills
      - design-taste-frontend
      - redesign-existing-projects
      - ian-xiaohei-illustrations

# 4. Skill 从哪里获取；声明顺序也是同名 Skill 的优先级
sources:
  unix2dos:
    github: unix2dos/skills
    checkout: ~/workspace/skills
    #exclude: [confidence-check]

  ljg-skills:
    github: lijigang/ljg-skills
    skills_dir: skills
    branch: master
    include: [ljg-plain, ljg-think, ljg-writes, ljg-structure, ljg-is, ljg-roundtable]

  archify:
    github: tt-a1i/archify
    skill: archify

  show-me:
    github: humanlayer/skills
    skill: plugins/show-me/skills/show-me

  mattpocock-engineering:
    github: mattpocock/skills
    checkout: ~/.skills-community/mattpocock-skills
    skills_dir: skills/engineering

  mattpocock-productivity:
    github: mattpocock/skills
    checkout: ~/.skills-community/mattpocock-skills
    skills_dir: skills/productivity

  sepia:
    github: Nanako0129/sepia
    skills_dir: skills

  find-skills:
    github: vercel-labs/skills
    skill: skills/find-skills

  design-taste-frontend:
    github: Leonxlnx/taste-skill
    skill: skills/taste-skill

  redesign-existing-projects:
    github: Leonxlnx/taste-skill
    skill: skills/redesign-skill

  ian-xiaohei-illustrations:
    github: helloianneo/ian-xiaohei-illustrations
    skill: ian-xiaohei-illustrations

# 5. 打包为云 Agent 可安装的 plugin：写入独立仓库 agent-skills-bundle（真实
#    文件，可私有）；push: true 时 install.sh 会在该仓库自动 commit + push
bundle:
  name: unix2dos-skills
  owner: unix2dos     # 写进 Claude marketplace.json
  path: ~/workspace/agent-skills-bundle   # 也支持相对 skills-manager/ 或绝对路径
  preset: default
  push: true

